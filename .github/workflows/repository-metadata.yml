name: Repository metadata (testbed caller)

on:
  workflow_dispatch:
    inputs:
      service_id:
        description: Service identifier
        required: true
        default: litellm
        type: string
      environment:
        description: Environment identifier
        required: true
        default: dev
        type: string
      handoff_id:
        description: Producer run ID that uploaded the verified handoff artifact
        required: true
        type: string
      artifact_name:
        description: verified-ap-handoff-<service>-<environment>-<handoff_id>
        required: true
        type: string

permissions:
  actions: read
  contents: read

jobs:
  repository-topics:
    uses: DS-Jerry-in-Taiwan/team-docs-testbed/.github/workflows/repository-topics-sync.yml@b9c1ee584c61ddc52e64447805d78dddd80544eb
    with:
      service_id: ${{ inputs.service_id }}
      environment: ${{ inputs.environment }}
      handoff_id: ${{ inputs.handoff_id }}
      consumer_run_id: ${{ github.run_id }}
      artifact_name: ${{ inputs.artifact_name }}
      team_docs_ref: b9c1ee584c61ddc52e64447805d78dddd80544eb
      app_client_id: ${{ vars.GH_APP_ID }}
    secrets:
      github_app_private_key: ${{ secrets.GH_APP_PRIVATE_KEY }}
