name: Auto Add to Project Board

on:
  issues:
    types: [opened]
  pull_request:
    types: [opened]

jobs:
  add-to-project:
    name: Add item to project
    runs-on: ubuntu-latest
    steps:
      - name: Add Issue or PR to Project
        uses: actions/add-to-project@v1.0.2
        with:
          # 預設指向 Search Engine #5 看板；若該 Repo 有設定 PROJECT_URL 變數則優先讀取
          project-url: ${{ vars.PROJECT_URL || 'https://github.com/orgs/1111corp/projects/5' }}
          # 讀取該 Repo 設定的 PAT Token
          github-token: ${{ secrets.ADD_TO_PROJECT_PAT }}
