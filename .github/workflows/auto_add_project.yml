name: Auto Add to Project Board

on:
  issues:
    types: [opened]
  pull_request:
    types: [opened]

jobs:
  add-to-project:
    name: Add item to project
    runs-on: ubuntu-latest
    steps:
      - name: Add Issue or PR to Project
        uses: actions/add-to-project@v1.0.2
        with:
          # 您高階看板的 URL 網址
          project-url: https://github.com/orgs/1111corp/projects/5
          # 預設使用的權限 Token（若跨組織看板需具備 project: write 權限的 token 或 PAT）
          github-token: ${{ secrets.GITHUB_TOKEN }}
